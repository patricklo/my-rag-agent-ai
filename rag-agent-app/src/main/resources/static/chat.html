<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义滚动条样式 */
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* 打字效果 */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .typing-indicator::after {
            content: '▋';
            animation: blink 1s infinite;
        }

        /* 过渡动画 */
        .transition-all {
            transition: all 0.3s ease;
        }

        /* 侧边栏切换动画 */
        .sidebar-transition {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-white h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- 左侧边栏 - 聊天列表 -->
        <div id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col sidebar-transition">
            <!-- 新建聊天按钮 -->
            <div class="p-4 border-b border-gray-200">
                <button 
                    id="newChatBtn"
                    onclick="createNewChat()"
                    class="w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors font-medium flex items-center justify-center gap-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    新建聊天
                </button>
            </div>

            <!-- 聊天列表 -->
            <div id="chatList" class="flex-1 overflow-y-auto scrollbar-thin p-2">
                <!-- 聊天项将动态添加到这里 -->
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col">
            <!-- 顶部导航栏 -->
            <div class="bg-white border-b border-gray-200 px-4 py-3">
                <div class="flex items-center justify-between">
                    <!-- 左侧：菜单、新建聊天、AI角色 -->
                    <div class="flex items-center gap-3">
                        <!-- 菜单按钮 -->
                        <button 
                            id="menuToggle"
                            onclick="toggleSidebar()"
                            class="p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors"
                            title="切换侧边栏"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                        
                        <!-- 新建聊天按钮 -->
                        <button 
                            onclick="createNewChat()"
                            class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors flex items-center gap-2"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                            </svg>
                            新建聊天
                        </button>

                        <!-- AI角色选择（可选） -->
                        <button 
                            class="p-1.5 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors"
                            title="选择AI角色"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- 中间：模型和提示词选择 -->
                    <div class="flex items-center gap-3">
                        <!-- 模型选择 -->
                        <div class="relative">
                            <select 
                                id="modelSelect"
                                class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-1.5 pr-8 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent cursor-pointer"
                            >
                                <option value="deepseek-r1:1.5b">deepseek-r1:1.5b</option>
                                <option value="llama2">llama2</option>
                                <option value="mistral">mistral</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- 提示词选择 -->
                        <div class="relative">
                            <select 
                                id="promptSelect"
                                class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-1.5 pr-8 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent cursor-pointer"
                            >
                                <option value="">选择提示词</option>
                                <option value="default">默认提示词</option>
                                <option value="code">代码助手</option>
                                <option value="creative">创意写作</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：设置和用户 -->
                    <div class="flex items-center gap-2">
                        <!-- 设置按钮 -->
                        <button 
                            class="p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors"
                            title="设置"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>

                        <!-- 用户头像 -->
                        <button 
                            class="p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors"
                            title="用户"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 消息区域 -->
            <div id="chatMessages" class="flex-1 overflow-y-auto scrollbar-thin p-6 space-y-4 bg-white">
                <!-- 状态指示器 -->
                <div id="statusIndicator" class="mb-4 flex justify-center">
                    <div class="bg-gray-100 rounded-lg px-4 py-2 flex items-center gap-2 text-sm text-gray-600">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span>Ollama is running</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>

                <!-- 初始提示 -->
                <div id="emptyState" class="text-center text-gray-500 py-12">
                    <p class="text-lg">选择一个聊天或创建新聊天开始对话</p>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="bg-white border-t border-gray-200 p-4">
                <div class="max-w-4xl mx-auto">
                    <div class="flex items-center gap-3">
                        <!-- 左侧：网络开关 -->
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                            </svg>
                            <span class="text-sm text-gray-600">Off</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="networkToggle" class="sr-only peer">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-gray-600"></div>
                            </label>
                        </div>

                        <!-- 中间：输入框 -->
                        <div class="flex-1 relative">
                            <input 
                                type="text" 
                                id="messageInput" 
                                placeholder="Type a message..." 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent outline-none pr-24"
                                onkeypress="handleKeyPress(event)"
                                disabled
                            >
                        </div>

                        <!-- 右侧：附件和提交按钮 -->
                        <div class="flex items-center gap-2">
                            <!-- 图片附件 -->
                            <button 
                                class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                                title="上传图片"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                            </button>

                            <!-- 文件附件 -->
                            <button 
                                class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                                title="上传文件"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                                </svg>
                            </button>

                            <!-- 语音输入 -->
                            <button 
                                class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                                title="语音输入"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                                </svg>
                            </button>

                            <!-- 提交按钮 -->
                            <button 
                                id="sendButton"
                                onclick="sendMessage()" 
                                class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium flex items-center gap-2"
                                disabled
                            >
                                <span>Submit</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 重命名对话框 -->
    <div id="renameDialog" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-96 shadow-xl">
            <h3 class="text-lg font-semibold mb-4">重命名聊天</h3>
            <input 
                type="text" 
                id="renameInput" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-500 focus:border-transparent mb-4"
                placeholder="输入新名称"
                onkeypress="if(event.key === 'Enter') confirmRename()"
            >
            <div class="flex gap-2 justify-end">
                <button 
                    onclick="closeRenameDialog()"
                    class="px-4 py-2 text-gray-600 hover:text-gray-800 transition-colors"
                >
                    取消
                </button>
                <button 
                    onclick="confirmRename()"
                    class="px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors"
                >
                    确认
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8090/my-rag-agent-ai/api/v1/ollama';
        
        // 聊天数据存储
        let chats = [];
        let currentChatId = null;
        let currentEventSource = null;
        let currentResponseElement = null;
        let fullContent = '';
        let sidebarVisible = true;

        // 初始化
        function init() {
            loadChats();
            if (chats.length > 0) {
                selectChat(chats[0].id);
            }
        }

        // 切换侧边栏
        function toggleSidebar() {
            sidebarVisible = !sidebarVisible;
            const sidebar = document.getElementById('sidebar');
            if (sidebarVisible) {
                sidebar.style.transform = 'translateX(0)';
            } else {
                sidebar.style.transform = 'translateX(-100%)';
            }
        }

        // 创建新聊天
        function createNewChat() {
            const chatId = 'chat_' + Date.now();
            const chat = {
                id: chatId,
                title: '新聊天 ' + (chats.length + 1),
                messages: [],
                createdAt: new Date().toISOString()
            };
            
            chats.unshift(chat);
            saveChats();
            renderChatList();
            selectChat(chatId);
        }

        // 渲染聊天列表
        function renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            chats.forEach(chat => {
                const chatItem = document.createElement('div');
                chatItem.className = `p-3 mb-2 rounded-lg cursor-pointer transition-all ${
                    currentChatId === chat.id 
                        ? 'bg-gray-100 border-2 border-gray-300' 
                        : 'hover:bg-gray-50 border-2 border-transparent'
                }`;
                chatItem.onclick = () => selectChat(chat.id);
                
                chatItem.innerHTML = `
                    <div class="font-medium text-gray-800 truncate">${escapeHtml(chat.title)}</div>
                    <div class="text-xs text-gray-500 mt-1">${formatDate(chat.createdAt)}</div>
                `;
                
                chatList.appendChild(chatItem);
            });
        }

        // 选择聊天
        function selectChat(chatId) {
            currentChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            
            if (!chat) return;

            // 更新UI
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;

            // 渲染消息
            renderMessages(chat.messages);
            
            // 更新聊天列表高亮
            renderChatList();
        }

        // 渲染消息
        function renderMessages(messages) {
            const chatMessages = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            
            if (messages.length === 0) {
                if (emptyState) {
                    emptyState.style.display = 'block';
                }
                return;
            }

            if (emptyState) {
                emptyState.style.display = 'none';
            }

            // 清除现有消息（保留状态指示器）
            const statusIndicator = document.getElementById('statusIndicator');
            chatMessages.innerHTML = '';
            if (statusIndicator) {
                chatMessages.appendChild(statusIndicator);
            }

            messages.forEach(msg => {
                if (msg.role === 'user') {
                    addUserMessageToDOM(msg.content);
                } else if (msg.role === 'assistant') {
                    addAIMessageToDOM(msg.content);
                }
            });

            scrollToBottom();
        }

        // 发送消息
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const modelSelect = document.getElementById('modelSelect');
            const sendButton = document.getElementById('sendButton');

            const message = messageInput.value.trim();
            const model = modelSelect.value || 'deepseek-r1:1.5b';

            if (!message || !currentChatId) {
                return;
            }

            // 隐藏空状态
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            // 禁用输入和按钮
            messageInput.disabled = true;
            sendButton.disabled = true;
            sendButton.textContent = '发送中...';

            // 关闭之前的连接
            if (currentEventSource) {
                currentEventSource.close();
            }

            // 重置内容
            fullContent = '';

            // 添加用户消息
            addUserMessageToDOM(message);
            saveUserMessage(message);

            // 创建 AI 响应消息容器
            currentResponseElement = addAIMessageToDOM('');

            // 构建 API URL
            const apiUrl = `${API_BASE_URL}/generate_stream?model=${encodeURIComponent(model)}&message=${encodeURIComponent(message)}`;

            // 使用 EventSource 进行流式请求
            try {
                currentEventSource = new EventSource(apiUrl);

                currentEventSource.onmessage = function(event) {
                    try {
                        const data = event.data;
                        parseAndProcessChunk(data);
                    } catch (error) {
                        console.error('处理消息错误:', error);
                    }
                };

                currentEventSource.onerror = function(error) {
                    console.error('EventSource 错误:', error);
                    if (currentEventSource.readyState === EventSource.CLOSED) {
                        currentEventSource.close();
                        // 如果 EventSource 失败，尝试使用 fetch
                        tryFetchStream(apiUrl);
                    }
                };

            } catch (error) {
                console.error('创建 EventSource 错误:', error);
                tryFetchStream(apiUrl);
            }
        }

        // 解析并处理数据块
        function parseAndProcessChunk(chunk) {
            try {
                let jsonStr = chunk;
                if (chunk.startsWith('data: ')) {
                    jsonStr = chunk.substring(6).trim();
                }
                
                const parsed = JSON.parse(jsonStr);
                
                if (Array.isArray(parsed)) {
                    parsed.forEach(item => {
                        processResponseItem(item);
                    });
                } else {
                    processResponseItem(parsed);
                }
            } catch (parseError) {
                console.warn('解析 JSON 失败:', parseError);
            }
        }

        // 处理单个响应项
        function processResponseItem(item) {
            if (!item) return;

            let result = item.result;
            if (!result) {
                result = item;
            }

            // 提取内容
            if (result && result.output && result.output.content !== undefined && result.output.content !== null) {
                const content = result.output.content;
                if (content) {
                    fullContent += content;
                    if (currentResponseElement) {
                        if (currentResponseElement.classList.contains('typing-indicator')) {
                            currentResponseElement.classList.remove('typing-indicator');
                        }
                        currentResponseElement.textContent = fullContent;
                        scrollToBottom();
                    }
                }
            }

            // 检查是否结束
            if (result && result.metadata && result.metadata.finishReason) {
                const finishReason = result.metadata.finishReason;
                if (finishReason === 'STOP' || finishReason === 'unknown') {
                    if (currentEventSource) {
                        currentEventSource.close();
                        currentEventSource = null;
                    }
                    // 保存AI消息
                    saveAIMessage(fullContent);
                    resetInput();
                }
            }
        }

        // 使用 fetch 进行流式请求（备用方案）
        async function tryFetchStream(apiUrl) {
            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        if (buffer.trim()) {
                            parseAndProcessChunk(buffer.trim());
                        }
                        break;
                    }

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine) {
                            parseAndProcessChunk(trimmedLine);
                        }
                    }
                }

                // 保存AI消息
                saveAIMessage(fullContent);
                resetInput();
            } catch (error) {
                console.error('Fetch 流式请求错误:', error);
                if (currentResponseElement) {
                    currentResponseElement.textContent = '❌ 请求失败: ' + error.message;
                    currentResponseElement.classList.remove('typing-indicator');
                }
                resetInput();
            }
        }

        // 添加用户消息到DOM
        function addUserMessageToDOM(message) {
            const chatMessages = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end mb-4';
            messageDiv.innerHTML = `
                <div class="max-w-[80%] bg-gray-900 text-white rounded-lg px-4 py-2 shadow-sm">
                    <p class="whitespace-pre-wrap">${escapeHtml(message)}</p>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // 添加AI消息到DOM
        function addAIMessageToDOM(content) {
            const chatMessages = document.getElementById('chatMessages');
            const emptyState = document.getElementById('emptyState');
            
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-start mb-4';
            const className = content ? '' : 'typing-indicator';
            messageDiv.innerHTML = `
                <div class="max-w-[80%] bg-gray-100 border border-gray-200 rounded-lg px-4 py-2 shadow-sm">
                    <p class="whitespace-pre-wrap ${className}">${escapeHtml(content)}</p>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv.querySelector('p');
        }

        // 保存用户消息
        function saveUserMessage(message) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({
                    role: 'user',
                    content: message,
                    timestamp: new Date().toISOString()
                });
                saveChats();
            }
        }

        // 保存AI消息
        function saveAIMessage(content) {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({
                    role: 'assistant',
                    content: content,
                    timestamp: new Date().toISOString()
                });
                saveChats();
            }
        }

        // 重置输入
        function resetInput() {
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            
            messageInput.disabled = false;
            sendButton.disabled = false;
            sendButton.textContent = 'Submit';
            messageInput.value = '';
            messageInput.focus();
            
            if (currentResponseElement && currentResponseElement.classList.contains('typing-indicator')) {
                currentResponseElement.classList.remove('typing-indicator');
            }
        }

        // 处理键盘事件
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 显示重命名对话框
        function showRenameDialog() {
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                document.getElementById('renameInput').value = chat.title;
                document.getElementById('renameDialog').classList.remove('hidden');
                document.getElementById('renameInput').focus();
            }
        }

        // 关闭重命名对话框
        function closeRenameDialog() {
            document.getElementById('renameDialog').classList.add('hidden');
        }

        // 确认重命名
        function confirmRename() {
            const newTitle = document.getElementById('renameInput').value.trim();
            if (newTitle) {
                const chat = chats.find(c => c.id === currentChatId);
                if (chat) {
                    chat.title = newTitle;
                    saveChats();
                    renderChatList();
                }
            }
            closeRenameDialog();
        }

        // 删除当前聊天
        function deleteCurrentChat() {
            if (!currentChatId) return;
            
            if (confirm('确定要删除这个聊天吗？')) {
                chats = chats.filter(c => c.id !== currentChatId);
                saveChats();
                
                if (chats.length > 0) {
                    selectChat(chats[0].id);
                } else {
                    // 没有聊天了，重置UI
                    currentChatId = null;
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    const emptyState = document.getElementById('emptyState');
                    if (emptyState) {
                        emptyState.style.display = 'block';
                    }
                }
                
                renderChatList();
            }
        }

        // 保存聊天到本地存储
        function saveChats() {
            localStorage.setItem('ai_chats', JSON.stringify(chats));
        }

        // 从本地存储加载聊天
        function loadChats() {
            const saved = localStorage.getItem('ai_chats');
            if (saved) {
                chats = JSON.parse(saved);
            }
            renderChatList();
        }

        // 滚动到底部
        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes}分钟前`;
            if (hours < 24) return `${hours}小时前`;
            if (days < 7) return `${days}天前`;
            return date.toLocaleDateString('zh-CN');
        }

        // 页面加载时初始化
        init();
    </script>
</body>
</html>
